<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06122b">
<title>푸드코트 맛 대결</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'">
<style>
  :root {
    --navy: #0b2350;
    --blue: #2563eb;
    --blue-soft: #eaf1ff;
    --bg: #f3f5fa;
    --card: #ffffff;
    --tile: #f4f6fb;
    --ink: #0e1a2f;
    --muted: #64748b;
    --line: #e2e8f0;
    --gold: #f2b01e;
    --silver: #a3afbf;
    --bronze: #d0884d;
    --live: #ef4444;
    --danger: #dc2626;
    --shadow: 0 1px 2px rgba(14,26,47,.05), 0 10px 30px rgba(14,26,47,.07);
    --radius: 20px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #060c18;
      --card: #0f1829;
      --tile: #152036;
      --ink: #e8eef8;
      --muted: #94a3b8;
      --line: #22304a;
      --blue: #4c8dff;
      --blue-soft: #14284d;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.25);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    letter-spacing: -0.01em;
    word-break: keep-all;
    overflow-wrap: break-word;
    padding-bottom: 32px;
    -webkit-tap-highlight-color: transparent;
  }
  body.bar-on { padding-bottom: calc(var(--bar-h, 96px) + 24px); }
  .wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; }
  button { font: inherit; letter-spacing: inherit; }

  /* ───── 상단 ───── */
  .hero {
    position: relative;
    overflow: hidden;
    color: #fff;
    background:
      radial-gradient(120% 80% at 90% -10%, rgba(76,141,255,.5), transparent 60%),
      radial-gradient(90% 70% at -10% 115%, rgba(242,176,30,.2), transparent 60%),
      linear-gradient(170deg, #06122b 0%, #0b2350 55%, #143a85 100%);
    padding-block: calc(24px + env(safe-area-inset-top, 0px)) 68px;
  }
  .hero::before {
    content: "";
    position: absolute; inset: 0;
    pointer-events: none;
    opacity: .75;
    background-image:
      radial-gradient(1.5px 1.5px at 8% 22%, #fff, transparent 70%),
      radial-gradient(1px 1px at 22% 8%, #fff, transparent 70%),
      radial-gradient(1.5px 1.5px at 38% 30%, #fff, transparent 70%),
      radial-gradient(1px 1px at 55% 12%, #fff, transparent 70%),
      radial-gradient(1px 1px at 64% 44%, #fff, transparent 70%),
      radial-gradient(1.5px 1.5px at 92% 58%, #fff, transparent 70%),
      radial-gradient(1px 1px at 48% 62%, #fff, transparent 70%),
      radial-gradient(1px 1px at 16% 52%, #fff, transparent 70%);
  }
  .sky-art { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .hero .wrap { position: relative; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 6px;
    margin: 0 0 14px;
    padding: 5px 12px 5px 10px;
    border-radius: 999px;
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.16);
    font-size: 12.5px; font-weight: 600;
  }
  .hero h1 { margin: 0; font-size: 36px; line-height: 1.15; font-weight: 800; letter-spacing: -.035em; }
  .hero h1 em {
    font-style: normal;
    background: linear-gradient(90deg, #ffe08a, #f2b01e 55%, #ffb347);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  .lead { margin: 12px 0 0; font-size: 15px; color: rgba(255,255,255,.82); word-break: keep-all; }
  .lead b { color: #fff; }
  .prizes { list-style: none; margin: 22px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .prizes li {
    display: flex; flex-direction: column; align-items: center;
    padding: 12px 6px 10px;
    border-radius: 16px;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.14);
    text-align: center;
  }
  .prizes .p1 { background: linear-gradient(180deg, rgba(242,176,30,.24), rgba(242,176,30,.05)); border-color: rgba(242,176,30,.45); }
  .prizes .medal { font-size: 26px; line-height: 1; }
  .prizes small { margin-top: 6px; font-size: 11px; font-weight: 600; color: rgba(255,255,255,.62); }
  .prizes b { font-size: 13.5px; word-break: keep-all; }

  main { margin-top: -38px; position: relative; }

  /* ───── 탭 ───── */
  .tabs {
    display: grid; grid-template-columns: 1fr 1fr;
    padding: 5px; margin-bottom: 14px;
    background: var(--card);
    border-radius: 16px;
    box-shadow: var(--shadow);
  }
  .tab {
    height: 46px; border: 0; border-radius: 12px;
    background: transparent; color: var(--muted);
    font-size: 15px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    cursor: pointer;
    transition: color .2s, background-color .2s;
  }
  .tab[aria-selected="true"] {
    background: linear-gradient(135deg, #0b2350, #2563eb);
    color: #fff;
    box-shadow: 0 6px 16px rgba(37,99,235,.28);
  }
  .tab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); animation: pulse 1.6s ease-in-out infinite; }

  .banner { margin-bottom: 12px; padding: 12px 14px; border-radius: 14px; background: #fff4d6; color: #6b4e00; font-size: 13px; }
  .banner.error { background: #fde8e8; color: #8a1f1f; }
  .banner.staff { background: var(--blue-soft); color: var(--blue); font-weight: 700; }
  .warn { margin: 0 0 12px; padding: 10px 12px; border-radius: 12px; background: #fff4d6; color: #6b4e00; font-size: 13px; font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    .banner, .warn { background: #3a2f10; color: #f3d98b; }
    .banner.error { background: #3d1717; color: #f5b5b5; }
  }

  /* ───── 카드 ───── */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px 18px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }
  .card h2 {
    margin: 0 0 16px;
    font-size: 18px; font-weight: 800; letter-spacing: -.03em;
    display: flex; align-items: center; gap: 9px;
  }
  .step {
    width: 24px; height: 24px; border-radius: 50%;
    display: grid; place-items: center;
    background: linear-gradient(135deg, #0b2350, #2563eb); color: #fff;
    font-size: 12px; font-weight: 800;
  }
  .count {
    margin-left: auto;
    padding: 3px 10px; border-radius: 999px;
    background: var(--tile); color: var(--muted);
    font-size: 12.5px; font-weight: 700;
    font-variant-numeric: tabular-nums;
    transition: background-color .2s, color .2s;
  }
  .count.full { background: var(--blue-soft); color: var(--blue); }

  .who { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; margin-bottom: 16px; }
  .who label { position: relative; cursor: pointer; }
  .who input { position: absolute; opacity: 0; pointer-events: none; }
  .who span {
    display: flex; align-items: center; justify-content: center;
    height: 46px; padding: 0 8px;
    border-radius: 14px; border: 2px solid transparent;
    background: var(--tile); color: var(--muted);
    font-size: 14.5px; font-weight: 700; text-align: center;
    transition: background-color .15s, border-color .15s, color .15s;
  }
  .who input:checked + span { background: var(--blue-soft); border-color: var(--blue); color: var(--blue); }
  .who input:focus-visible + span { outline: 2px solid var(--blue); outline-offset: 2px; }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field { display: block; margin-bottom: 12px; }
  .field > span { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 700; color: var(--muted); }
  .field select, .field input {
    width: 100%; height: 52px;
    padding: 0 14px;
    font: inherit; font-size: 16px; /* 16px 미만이면 iOS가 확대함 */
    color: var(--ink);
    background: var(--tile);
    border: 1.5px solid transparent;
    border-radius: 14px;
    outline: none;
    appearance: none; -webkit-appearance: none;
    transition: border-color .15s, background-color .15s;
  }
  .field select {
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 20px) 50%, calc(100% - 15px) 50%;
    background-size: 5px 5px;
    background-repeat: no-repeat;
    padding-right: 34px;
  }
  .field select:focus, .field input:focus { border-color: var(--blue); background-color: var(--card); }
  .field.invalid select, .field.invalid input { border-color: var(--danger); }
  .hint { margin: 0; font-size: 12.5px; color: var(--muted); }
  .hint b { color: var(--blue); }

  /* ───── 부스 타일 ───── */
  .tiles { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .tile {
    position: relative;
    display: flex; flex-direction: column;
    height: 100%; min-height: 128px;
    padding: 12px 12px 14px;
    border-radius: 18px;
    background: var(--tile);
    border: 2px solid transparent;
    cursor: pointer;
    user-select: none;
    transition: transform .15s, border-color .15s, background-color .15s, box-shadow .15s, opacity .2s;
  }
  .tile:active { transform: scale(.97); }
  .tile input { position: absolute; opacity: 0; pointer-events: none; }
  .tile-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .emoji { display: grid; place-items: center; flex: none; line-height: 1; }
  .tile .emoji { width: 46px; height: 46px; border-radius: 14px; background: var(--card); font-size: 25px; transition: transform .2s; }
  .tile .no { font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; transition: opacity .15s; }
  .tick {
    position: absolute; top: 10px; right: 10px;
    width: 26px; height: 26px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--blue);
    transform: scale(0);
    transition: transform .25s cubic-bezier(.3,1.6,.5,1);
  }
  .tick svg { width: 14px; height: 14px; }
  .tile-name { font-size: 15px; line-height: 1.3; word-break: keep-all; }
  .tile-menu {
    margin-top: 3px;
    font-size: 12.5px; line-height: 1.35; color: var(--muted);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    word-break: keep-all;
  }
  .tile.on { background: var(--blue-soft); border-color: var(--blue); box-shadow: 0 8px 20px rgba(37,99,235,.15); }
  .tile.on .tick { transform: scale(1); }
  .tile.on .no { opacity: 0; }
  .tile.on .emoji { transform: rotate(-8deg) scale(1.06); }
  .tile:focus-within { outline: 2px solid var(--blue); outline-offset: 2px; }
  .tiles.full .tile:not(.on) { opacity: .42; }

  /* ───── 하단 바 ───── */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    background: var(--card);
    background: color-mix(in srgb, var(--card) 86%, transparent);
    -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4);
    border-top: 1px solid var(--line);
  }
  .bar .wrap { padding-inline: 0; }
  .picks { display: flex; gap: 6px; padding-bottom: 10px; overflow-x: auto; scrollbar-width: none; }
  .picks::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    display: inline-flex; align-items: center; gap: 6px;
    height: 34px; padding: 0 12px 0 10px;
    border: 0; border-radius: 999px;
    background: var(--blue-soft); color: var(--blue);
    font-size: 13.5px; font-weight: 700;
    cursor: pointer;
    animation: pop .25s cubic-bezier(.3,1.5,.5,1);
  }
  .chip-x { font-size: 11px; opacity: .6; }
  .btn {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 56px;
    border: 0; border-radius: 16px;
    font-size: 17px; font-weight: 800;
    cursor: pointer;
    transition: transform .1s, opacity .2s;
  }
  .btn:active:not(:disabled) { transform: scale(.98); }
  .btn.primary { background: linear-gradient(135deg, #0b2350 0%, #2563eb 100%); color: #fff; box-shadow: 0 10px 24px rgba(37,99,235,.3); }
  .btn.primary:disabled { background: var(--line); color: var(--muted); box-shadow: none; cursor: default; }
  .btn.ghost { background: var(--tile); color: var(--ink); }
  .btn .badge {
    display: inline-grid; place-items: center;
    min-width: 26px; height: 24px; margin-left: 8px; padding: 0 8px;
    border-radius: 999px;
    background: rgba(255,255,255,.2);
    font-size: 13px;
  }

  /* ───── 확인 시트 ───── */
  .backdrop {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(5,12,24,.55);
    display: flex; align-items: flex-end; justify-content: center;
    animation: fade .2s ease;
  }
  .sheet {
    width: 100%; max-width: 560px;
    background: var(--card);
    border-radius: 26px 26px 0 0;
    padding: 12px 20px calc(20px + env(safe-area-inset-bottom, 0px));
    animation: up .3s cubic-bezier(.2,.8,.2,1);
  }
  .sheet::before { content: ""; display: block; width: 40px; height: 5px; margin: 0 auto 18px; border-radius: 99px; background: var(--line); }
  .sheet h3 { margin: 0 0 16px; font-size: 21px; font-weight: 800; letter-spacing: -.03em; }
  .summary { margin: 0 0 14px; padding: 16px; display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; border-radius: 16px; background: var(--tile); font-size: 15px; }
  .summary dt { color: var(--muted); }
  .summary dd { margin: 0; font-weight: 700; }
  .actions { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; margin-top: 18px; }

  /* ───── 완료 / 마감 ───── */
  .center { text-align: center; padding: 34px 20px 24px; }
  .done-badge {
    width: 78px; height: 78px; margin: 0 auto 16px; border-radius: 50%;
    display: grid; place-items: center;
    color: #fff;
    background: linear-gradient(135deg, #2563eb, #4c8dff);
    box-shadow: 0 0 0 8px var(--blue-soft), 0 14px 30px rgba(37,99,235,.35);
    animation: pop .5s cubic-bezier(.3,1.5,.5,1);
  }
  .done-badge svg { width: 38px; height: 38px; }
  .done-badge.clock { background: var(--tile); color: var(--muted); box-shadow: none; animation: none; }
  .center h2 { justify-content: center; margin-bottom: 6px; font-size: 24px; }
  .center p { margin: 0; color: var(--muted); }
  .ticket { position: relative; max-width: 340px; margin: 24px auto 0; border-radius: 18px; background: var(--tile); overflow: hidden; text-align: left; }
  .ticket-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 14px 18px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .ticket-head b { color: var(--ink); }
  .ticket-body { position: relative; display: grid; gap: 12px; padding: 16px 18px 18px; border-top: 2px dashed var(--line); }
  .ticket-body::before, .ticket-body::after { content: ""; position: absolute; top: -11px; width: 20px; height: 20px; border-radius: 50%; background: var(--card); }
  .ticket-body::before { left: -10px; }
  .ticket-body::after { right: -10px; }
  .ticket-pick { display: flex; align-items: center; gap: 12px; }
  .ticket-pick .emoji { width: 42px; height: 42px; border-radius: 12px; background: var(--card); font-size: 23px; }
  .ticket-pick b { display: block; font-size: 15px; }
  .ticket-pick small { display: block; font-size: 12.5px; color: var(--muted); }
  .stack { display: grid; gap: 8px; max-width: 340px; margin: 20px auto 0; }

  /* ───── 실시간 순위 ───── */
  .rank-head { display: flex; align-items: center; gap: 8px; }
  .rank-head h2 { margin: 0; }
  .live {
    margin-left: auto;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px;
    background: rgba(239,68,68,.1); color: var(--live);
    font-size: 11.5px; font-weight: 800; letter-spacing: .1em;
  }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.6s ease-in-out infinite; }
  .live.off { background: var(--tile); color: var(--muted); }
  .live.off i { animation: none; }
  .rank-meta { margin: 6px 0 20px; font-size: 13px; color: var(--muted); }
  .rank-hidden { text-align: center; padding: 26px 8px 14px; color: var(--muted); }
  .rank-hidden b { display: block; margin-bottom: 4px; color: var(--ink); font-size: 17px; }

  .t1 { --tier: var(--gold); --tier-deep: #c98a00; --tier-ink: #b07a00; }
  .t2 { --tier: var(--silver); --tier-deep: #7b8798; --tier-ink: #6b7686; }
  .t3 { --tier: var(--bronze); --tier-deep: #a35f27; --tier-ink: #a35f27; }
  @media (prefers-color-scheme: dark) {
    .t1 { --tier-ink: #ffcf4d; }
    .t2 { --tier-ink: #c7d0db; }
    .t3 { --tier-ink: #e7a36c; }
  }

  .podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: end; gap: 8px; margin-bottom: 18px; padding-top: 18px; }
  .slot { display: flex; flex-direction: column; align-items: center; min-width: 0; text-align: center; }
  .slot-emoji {
    position: relative;
    width: 58px; height: 58px; margin-bottom: 8px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--card); font-size: 29px; line-height: 1;
    box-shadow: 0 0 0 3px var(--tier), 0 8px 18px rgba(14,26,47,.14);
  }
  .s1 .slot-emoji { width: 70px; height: 70px; font-size: 36px; }
  .s1:not(.empty) .slot-emoji::before { content: "👑"; position: absolute; top: -24px; font-size: 22px; animation: float 2.4s ease-in-out infinite; }
  .slot-name {
    font-size: 13.5px; line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    word-break: keep-all;
  }
  .slot-votes { display: inline-block; margin: 3px 0 8px; font-size: 14px; font-weight: 800; color: var(--tier-ink); font-variant-numeric: tabular-nums; }
  .block {
    width: 100%;
    display: flex; flex-direction: column; align-items: center;
    padding: 12px 4px 0;
    border-radius: 14px 14px 6px 6px;
    background: linear-gradient(180deg, var(--tier), var(--tier-deep));
    color: #fff;
  }
  .s1 .block { height: 120px; }
  .s2 .block { height: 94px; }
  .s3 .block { height: 76px; }
  .block-rank { font-size: 30px; font-weight: 900; line-height: 1; text-shadow: 0 2px 6px rgba(0,0,0,.15); }
  .block-award { max-width: 94%; margin-top: 7px; padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,.22); font-size: 11.5px; font-weight: 700; line-height: 1.35; word-break: keep-all; }
  .slot.empty .slot-emoji { box-shadow: none; border: 2px dashed var(--line); color: var(--muted); font-size: 22px; font-weight: 800; }
  .slot.empty .slot-name { color: var(--muted); }
  .slot.empty .block { background: var(--tile); color: var(--muted); }
  .slot.empty .block-award { background: transparent; }

  .ranks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .rank {
    display: grid; grid-template-columns: 24px 42px minmax(0, 1fr) auto; align-items: center; gap: 10px;
    padding: 10px 14px 10px 10px;
    border-radius: 16px;
    background: var(--tile);
  }
  .rank .pos { text-align: center; font-size: 15px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
  .rank .emoji { width: 42px; height: 42px; border-radius: 12px; background: var(--card); font-size: 23px; }
  .rank .body { min-width: 0; }
  .rank .name { display: flex; align-items: center; gap: 6px; }
  .rank .name b { min-width: 0; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank .award { flex: none; padding: 1px 7px; border-radius: 999px; background: var(--tier); color: #fff; font-size: 11px; font-weight: 800; }
  .rank .menu { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank .votes { display: inline-block; font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .rank.winner .pos, .rank.winner .votes { color: var(--tier-ink); }
  .meter { height: 5px; margin-top: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .meter i { display: block; width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #2563eb, #4c8dff); transition: width .7s cubic-bezier(.2,.8,.2,1); }
  .rank.winner .meter i { background: var(--tier); }
  .bump { animation: bump .6s ease; }

<script>
/* ================================================================

const CONFIG = {
  festival: '공군사관학교 · 2026 성무제',

  // 구글 시트 '설정' 탭의 '웹페이지 연결 링크'를 그대로 붙여넣으세요.

  // 실시간 순위: Apps Script 웹 앱 주소 (https://script.google.com/macros/s/.../exec)

  liveRefreshSec: 20,

  maxPicks: 2,

  // 투표자 구분. 첫 번째(생도)는 기수·중대를, 나머지는 휴대폰 뒷 4자리를 입력받습니다.
  // note 는 그 구분을 골랐을 때 아래에 보이는 안내 문구입니다.
  voterTypes: [
    { label: '생도' },
    { label: '장병', note: '장교·부사관·병사·군무원 모두 여기를 골라주세요.' },

  // 실제 재학 기수 / 중대 편성에 맞게 수정하세요.

  // 부스 목록 (순서 = 화면의 부스 번호)

  booths: [
    { emoji: '🍖', name: '쭈식탁', menu: '돼지고기 바비큐' },
    { emoji: '🥐', name: '결심당', menu: '카페, 베이커리' },

    { emoji: '🍔', name: '생활실 출입버거', menu: '햄버거' },

    { emoji: '🌶️', name: '뚜기 분식집', menu: '떡볶이, 디저트' },
    { emoji: '🍜', name: '공사N하노이쌈', menu: '분짜, 반미' },
    { emoji: '🍢', name: '꼬작사(꼬치작전사령부)', menu: '뼈통삼겹꼬치' },
    { emoji: '🥞', name: '4전&비', menu: '전' },
    { emoji: '🥑', name: '홀리몰리 과카몰리', menu: '과카몰리 샌드위치' },
    { emoji: '🍣', name: '불초밥집', menu: '불초밥' },
    { emoji: '🥔', name: '성무길감자', menu: '길감자' },
    { emoji: '🍹', name: 'Cafe Spring', menu: '무알콜칵테일' },
    { emoji: '🍳', name: 'MO지리MO임', menu: '불닭오믈렛, 해쉬브라운, 대패삼겹살' },
    { emoji: '🥢', name: '성무반점', menu: '짜장면, 우동' },
    { emoji: '🍗', name: '암탉과 수탉', menu: '구운치킨' },
    { emoji: '🍦', name: '빼앰', menu: '아이스크림' },
    { emoji: '🥪', name: '산도 식당', menu: '튀김 산도' },
    { emoji: '🌭', name: '핫까시🦅', menu: '핫도그, 떡꼬치' },
  ],

  // 투표 가능 시간 (비워두면 항상 열림). 예: '2026-11-01T11:00:00+09:00'

  voteEnd: '',
};
/* ================================================================ */

const FIELDS = ['기수', '중대', '이름', '부스1', '부스2'];
const AWARDS = ['교장상', '생도대장상', '생도전대장상'];
const DEVICE_FIELD = '기기';
const STORE_KEY = 'foodcourt-vote:v1';
const DEVICE_KEY = 'foodcourt-device';
const STAFF_KEY = 'foodcourt-staff';
const CONFETTI_SRC = 'https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.js';
const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const params = new URLSearchParams(location.search);
const BOARD = params.has('board');

const CADET = CONFIG.voterTypes[0].label;
const BOOTHS = CONFIG.booths.map((b, i) => ({ ...b, emoji: b.emoji || '🍽️', no: i + 1 }));
const boothByName = Object.fromEntries(BOOTHS.map((b) => [b.name, b]));

const $ = (id) => document.getElementById(id);
const els = {
  banner: $('banner'), tabs: document.querySelectorAll('.tab'),
  voteArea: $('voteArea'), voteView: $('voteView'), doneView: $('doneView'), closedView: $('closedView'),
  who: $('who'), cadetFields: $('cadetFields'), phoneField: $('phoneField'), phone: $('phone'), whoHint: $('whoHint'),
  gisu: $('gisu'), company: $('company'), name: $('name'), booths: $('booths'), count: $('count'),
  bar: $('bar'), pickChips: $('pickChips'), submitBtn: $('submitBtn'), sheet: $('sheet'), changeBtn: $('changeBtn'),
  nextBtn: $('nextBtn'), doneRankBtn: $('doneRankBtn'), sheetWarn: $('sheetWarn'),
  confirmSummary: $('confirmSummary'), ticketWho: $('ticketWho'), ticketPicks: $('ticketPicks'),
  cancelBtn: $('cancelBtn'), confirmBtn: $('confirmBtn'), toast: $('toast'),
  rankView: $('rankView'), rankLayout: $('rankLayout'), podium: $('podium'), ranks: $('ranks'),
  rankMeta: $('rankMeta'), rankHidden: $('rankHidden'), liveBadge: $('liveBadge'),
};

// 안전하게 요소를 만드는 도우미 (textContent 사용)
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

const storage = {
  get() { try { return JSON.parse(localStorage.getItem(STORE_KEY)); } catch { return null; } },
  set(v) { try { localStorage.setItem(STORE_KEY, JSON.stringify(v)); } catch {} },
  clear() { try { localStorage.removeItem(STORE_KEY); } catch {} },
};

// 미리 채워진 링크에서 응답 주소와 entry ID를 뽑아냄
function parseFormLink(link) {
  if (!link.trim()) return null;
  const url = new URL(link.trim());
  const ids = {};
  for (const [key, value] of url.searchParams) {
    if (key.startsWith('entry.')) ids[value.trim()] = key;
  }
  const missing = FIELDS.filter((f) => !ids[f]);
  if (missing.length) throw new Error(`구글폼 링크에서 '${missing.join("', '")}' 항목을 찾지 못했습니다. 미리 채우기 값을 확인하세요.`);
  return { action: url.origin + url.pathname.replace(/\/viewform$/, '/formResponse'), ids };
}

let form = null;
let formError = null;
try { form = parseFormLink(CONFIG.formPrefillLink); } catch (e) { formError = e.message; }
// 구글폼에 '기기' 질문이 있을 때만 기기당 1표가 동작함
const DEVICE_ON = !!(form && form.ids[DEVICE_FIELD]);

// 운영본부 폰: ?staff=코드 로 한 번 열면 기억함 (?staff=off 로 해제). 코드가 맞는지는 집계 스크립트가 확인함
const STAFF = (() => {
  const code = params.get('staff');
  try {
    if (code === 'off') localStorage.removeItem(STAFF_KEY);
    else if (code) localStorage.setItem(STAFF_KEY, code);
    return localStorage.getItem(STAFF_KEY);
  } catch {
    return code && code !== 'off' ? code : null;
  }
})();

// 기기 번호: 이 브라우저에 한 번 만들어 두고 투표마다 함께 보냄 (같은 기기의 표는 마지막 것만 인정)
function deviceId() {
  const make = () => 'd-' + (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36));
  try {
    let id = localStorage.getItem(DEVICE_KEY);
    if (!id) {
      id = make();
      localStorage.setItem(DEVICE_KEY, id);
    }
    return id;
  } catch {
    return make();
  }
}

function showBanner(text, kind = '') {
  els.banner.textContent = text;
  els.banner.className = `banner ${kind}`.trim();
  els.banner.hidden = false;
}

let toastTimer;
function toast(msg) {
  els.toast.textContent = msg;
  els.toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => els.toast.classList.remove('show'), 2200);
}

function fillSelect(select, items) {
  for (const item of items) select.add(new Option(item, item));
}

function votingWindow() {
  const now = Date.now();
  if (CONFIG.voteStart && now < new Date(CONFIG.voteStart)) return 'before';
  if (CONFIG.voteEnd && now > new Date(CONFIG.voteEnd)) return 'after';
  return 'open';
}

/* ───────────── 탭 / 화면 전환 ───────────── */

let tab = 'vote';
let voteState = 'form'; // form | done | closed

function setTab(next) {
  tab = next;
  els.tabs.forEach((t) => t.setAttribute('aria-selected', String(t.dataset.tab === next)));
  els.voteArea.hidden = next !== 'vote';
  els.rankView.hidden = next !== 'rank';
  updateBar();
  if (next === 'rank') startLive(); else stopLive();
  window.scrollTo({ top: 0 });
}

function showVoteState(state) {
  voteState = state;
  els.voteView.hidden = state !== 'form';
  els.doneView.hidden = state !== 'done';
  els.closedView.hidden = state !== 'closed';
  updateBar();
}

function updateBar() {
  els.bar.hidden = BOARD || tab !== 'vote' || voteState !== 'form';
  syncBar();
}

// 하단 바 높이만큼 본문 여백과 알림 위치를 맞춤
function syncBar() {
  const on = !els.bar.hidden;
  document.body.classList.toggle('bar-on', on);
  if (on) document.body.style.setProperty('--bar-h', `${els.bar.offsetHeight}px`);
}

els.tabs.forEach((t) => t.addEventListener('click', () => setTab(t.dataset.tab)));
document.querySelectorAll('[data-goto]').forEach((b) => b.addEventListener('click', () => setTab(b.dataset.goto)));

/* ───────────── 투표자 구분 ───────────── */

function renderWho() {
  CONFIG.voterTypes.forEach((type, i) => {
    const input = el('input');
    input.type = 'radio';
    input.name = 'who';
    input.value = type.label;
    input.checked = i === 0;
    const label = el('label');
    label.append(input, el('span', null, type.label));
    els.who.append(label);
  });
  els.who.addEventListener('change', applyType);
}

const currentType = () => els.who.querySelector('input:checked')?.value || CADET;
const isCadet = (v) => !v.type || v.type === CADET;
const voterLabel = (v) => (isCadet(v) ? `${v.gisu} ${v.company} ${v.name}` : `${v.type} ${v.name}`);

function setType(type) {
  const radio = [...els.who.querySelectorAll('input')].find((r) => r.value === type);
  if (radio) radio.checked = true;
  applyType();
}

function applyType() {
  const type = currentType();
  const cadet = type === CADET;
  const note = CONFIG.voterTypes.find((t) => t.label === type)?.note;
  els.cadetFields.hidden = !cadet;
  els.phoneField.hidden = cadet;
  const rule = STAFF
    ? '운영본부 모드: 투표가 끝나면 다음 사람이 바로 투표할 수 있어요.'
    : DEVICE_ON
      ? '한 폰에서는 한 사람만 투표할 수 있어요. 다시 투표하면 마지막 투표로 바뀌어요.'
      : '마음이 바뀌면 다시 투표할 수 있어요. 같은 사람의 마지막 투표만 반영됩니다.';
  els.whoHint.textContent = cadet ? rule : `휴대폰 뒷번호는 같은 사람인지 확인하는 데만 쓰여요. ${rule}`;
  if (note) els.whoHint.replaceChildren(el('b', null, note), el('br'), els.whoHint.textContent);
  document.querySelectorAll('.field.invalid').forEach((f) => f.classList.remove('invalid'));
}

/* ───────────── 투표 ───────────── */

function renderBooths() {
  for (const b of BOOTHS) {
    const li = el('li');
    const label = el('label', 'tile');
    const input = el('input');
    input.type = 'checkbox';
    input.value = b.name;
    const top = el('span', 'tile-top');
    top.append(el('span', 'emoji', b.emoji), el('span', 'no', String(b.no).padStart(2, '0')));
    const tick = el('span', 'tick');
    tick.innerHTML = CHECK_SVG;
    label.append(input, top, tick, el('b', 'tile-name', b.name));
    if (b.menu) label.append(el('span', 'tile-menu', b.menu));
    li.append(label);
    els.booths.append(li);
  }
}

// 선택 순서를 유지하기 위해 따로 기록
let picks = [];

const boxFor = (name) => [...els.booths.querySelectorAll('input')].find((b) => b.value === name);

function setChecked(box, on) {
  box.checked = on;
  box.closest('.tile').classList.toggle('on', on);
}

function updatePicks() {
  const full = picks.length >= CONFIG.maxPicks;
  els.booths.classList.toggle('full', full);
  els.count.textContent = `${picks.length} / ${CONFIG.maxPicks}`;
  els.count.classList.toggle('full', full);

  els.submitBtn.disabled = picks.length === 0;
  if (picks.length) els.submitBtn.replaceChildren('투표하기', el('span', 'badge', `${picks.length}/${CONFIG.maxPicks}`));
  else els.submitBtn.textContent = '맛있었던 부스를 골라주세요';

  els.pickChips.replaceChildren(...picks.map((name) => {
    const chip = el('button', 'chip');
    chip.type = 'button';
    chip.setAttribute('aria-label', `${name} 선택 취소`);
    chip.append(el('span', null, boothByName[name].emoji), el('span', null, name), el('span', 'chip-x', '✕'));
    chip.addEventListener('click', () => unpick(name));
    return chip;
  }));
  els.pickChips.hidden = !picks.length;
  syncBar();
}

function unpick(name) {
  picks = picks.filter((p) => p !== name);
  const box = boxFor(name);
  if (box) setChecked(box, false);
  updatePicks();
}

function setPicks(list) {
  picks = list.filter((n) => boothByName[n]).slice(0, CONFIG.maxPicks);
  for (const box of els.booths.querySelectorAll('input')) setChecked(box, picks.includes(box.value));
  updatePicks();
}

els.booths.addEventListener('change', (e) => {
  const box = e.target;
  if (box.checked && picks.length >= CONFIG.maxPicks) {
    setChecked(box, false);
    toast(`최대 ${CONFIG.maxPicks}곳까지 고를 수 있어요`);
    return;
  }
  if (box.checked) picks.push(box.value);
  else picks = picks.filter((p) => p !== box.value);
  setChecked(box, box.checked);
  updatePicks();
});

function readForm() {
  const type = currentType();
  const cadet = type === CADET;
  return {
    type,
    gisu: cadet ? els.gisu.value : '',
    company: cadet ? els.company.value : '',
    phone: cadet ? '' : els.phone.value.trim(),
    name: els.name.value.trim().replace(/\s+/g, ' '),
    booths: [...picks],
  };
}

function validate(v) {
  const cadet = isCadet(v);
  const checks = [
    [els.gisu, cadet && !v.gisu, '기수를 선택해 주세요'],
    [els.company, cadet && !v.company, '중대를 선택해 주세요'],
    [els.name, v.name.length < 2, '이름을 입력해 주세요'],
    [els.phone, !cadet && !/^\d{4}$/.test(v.phone), '휴대폰 번호 뒷 4자리를 입력해 주세요'],
  ];
  document.querySelectorAll('.field.invalid').forEach((f) => f.classList.remove('invalid'));
  const failed = checks.find(([, bad]) => bad);
  if (!failed) return true;
  const [input, , msg] = failed;
  input.closest('.field').classList.add('invalid');
  input.scrollIntoView({ behavior: 'smooth', block: 'center' });
  setTimeout(() => input.focus({ preventScroll: true }), 300);
  toast(msg);
  return false;
}

function renderSummary(dl, v) {
  dl.replaceChildren();
  const rows = [
    ['투표자', voterLabel(v)],
    ...(isCadet(v) ? [] : [['뒷번호', v.phone]]),
    ...v.booths.map((b, i) => [`선택 ${i + 1}`, `${boothByName[b]?.emoji || '🍽️'} ${b}`]),
  ];
  for (const [k, val] of rows) dl.append(el('dt', null, k), el('dd', null, val));
}

function openSheet(v) {
  renderSummary(els.confirmSummary, v);
  // 개인 폰에서 다른 사람으로 다시 투표하면 앞사람 표가 사라진다는 것을 미리 알림
  const saved = STAFF || !DEVICE_ON ? null : storage.get();
  const other = saved && voterLabel(saved) + (saved.phone || '') !== voterLabel(v) + (v.phone || '');
  els.sheetWarn.hidden = !other;
  if (other) els.sheetWarn.textContent = `⚠️ 이 폰으로 투표한 ${voterLabel(saved)}님의 표는 사라지고 이번 투표만 남아요. 폰이 없는 분은 운영본부에서 투표할 수 있어요.`;
  els.sheet.hidden = false;
  els.confirmBtn.focus();
}
function closeSheet() { els.sheet.hidden = true; }

async function sendVote(v) {
  if (!form) {
    await new Promise((r) => setTimeout(r, 700)); // 테스트 모드
    return;
  }
  // 생도가 아니면 기수 칸에 구분, 중대 칸에 휴대폰 뒷번호를 넣어 같은 사람을 구분함
  const cadet = isCadet(v);
  const body = new URLSearchParams();
  body.append(form.ids['기수'], cadet ? v.gisu : v.type);
  body.append(form.ids['중대'], cadet ? v.company : `뒷번호 ${v.phone}`);
  body.append(form.ids['이름'], v.name);
  body.append(form.ids['부스1'], v.booths[0] || '');
  body.append(form.ids['부스2'], v.booths[1] || '');
  if (DEVICE_ON) body.append(form.ids[DEVICE_FIELD], STAFF ? `staff:${STAFF}` : deviceId());

  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 15000);
  try {
    // 구글폼은 응답 내용을 읽을 수 없지만(no-cors) 전송은 정상적으로 됩니다.
    await fetch(form.action, { method: 'POST', mode: 'no-cors', body, signal: ctrl.signal });
  } finally {
    clearTimeout(timer);
  }
}

let sending = false;
els.submitBtn.addEventListener('click', () => {
  const v = readForm();
  if (!v.booths.length) return;
  if (validate(v)) openSheet(v);
});
els.cancelBtn.addEventListener('click', closeSheet);
els.sheet.addEventListener('click', (e) => { if (e.target === els.sheet && !sending) closeSheet(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !els.sheet.hidden && !sending) closeSheet(); });

els.confirmBtn.addEventListener('click', async () => {
  if (sending) return;
  sending = true;
  const v = readForm();
  const changed = !STAFF && !!storage.get();
  els.confirmBtn.disabled = els.cancelBtn.disabled = true;
  els.confirmBtn.replaceChildren(el('span', 'spinner'), '제출 중…');
  try {
    await sendVote(v);
    const record = { ...v, at: new Date().toISOString() };
    if (!STAFF) storage.set(record); // 운영본부 폰에는 투표자 정보를 남기지 않음
    closeSheet();
    showDone(record, changed);
    celebrate();
  } catch {
    toast('제출에 실패했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.');
  } finally {
    sending = false;
    els.confirmBtn.disabled = els.cancelBtn.disabled = false;
    els.confirmBtn.textContent = '투표하기';
  }
});

function showDone(record, changed) {
  $('doneTitle').textContent = changed ? '투표를 변경했어요!' : '투표 완료!';
  els.ticketWho.textContent = voterLabel(record);
  els.ticketPicks.replaceChildren(...(record.booths || []).map((name) => {
    const b = boothByName[name] || { name, emoji: '🍽️' };
    const text = el('div');
    text.append(el('b', null, b.name));
    if (b.menu) text.append(el('small', null, b.menu));
    const row = el('div', 'ticket-pick');
    row.append(el('span', 'emoji', b.emoji), text);
    return row;
  }));
  els.changeBtn.hidden = !!STAFF || votingWindow() !== 'open';
  els.nextBtn.hidden = !STAFF;
  if (STAFF) $('doneText').replaceChildren('투표가 저장됐어요.', el('br'), '아래 버튼을 눌러 다음 분이 투표하세요.');
  els.doneRankBtn.classList.toggle('primary', !STAFF);
  els.doneRankBtn.classList.toggle('ghost', !!STAFF);
  showVoteState('done');
  window.scrollTo({ top: 0 });
}

// 투표 완료 꽃가루 (라이브러리를 못 불러오면 조용히 생략)
function celebrate() {
  const fire = () => window.confetti && window.confetti({
    particleCount: 140, spread: 75, startVelocity: 38, origin: { y: 0.3 },
    colors: ['#f2b01e', '#ffe08a', '#2563eb', '#93c5fd', '#ffffff'],
    disableForReducedMotion: true,
  });
  if (window.confetti) return fire();
  const s = document.createElement('script');
  s.src = CONFETTI_SRC;
  s.async = true;
  s.onload = fire;
  document.head.append(s);
}

els.changeBtn.addEventListener('click', () => {
  const saved = storage.get();
  if (saved) {
    setType(saved.type || CADET);
    els.gisu.value = saved.gisu || '';
    els.company.value = saved.company || '';
    els.phone.value = saved.phone || '';
    els.name.value = saved.name;
    setPicks(saved.booths || []);
  }
  showVoteState('form');
  window.scrollTo({ top: 0 });
});

// 운영본부 모드: 다음 사람을 위해 입력 내용을 모두 비움
els.nextBtn.addEventListener('click', () => {
  setType(CADET);
  for (const input of [els.gisu, els.company, els.name, els.phone]) input.value = '';
  setPicks([]);
  showVoteState('form');
  window.scrollTo({ top: 0 });
});

function showClosed(title, text) {
  $('closedTitle').textContent = title;
  $('closedText').textContent = text;
  showVoteState('closed');
}

function formatTime(d) {
  return d.toLocaleString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit' });
}

/* ───────────── 실시간 순위 ───────────── */

let liveTimer = null;
let liveBusy = false;
let lastLive = null;
let prevVotes = {};

function startLive() {
  if (liveTimer) return;
  refreshLive();
  liveTimer = setInterval(refreshLive, CONFIG.liveRefreshSec * 1000);
}
function stopLive() {
  clearInterval(liveTimer);
  liveTimer = null;
}
document.addEventListener('visibilitychange', () => {
  if (tab !== 'rank') return;
  if (document.hidden) stopLive(); else startLive();
});

async function fetchLive() {
  if (!CONFIG.liveUrl) return { notConnected: true };
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 25000); // Apps Script는 첫 요청이 10초 가까이 걸릴 수 있음
  try {
    const res = await fetch(CONFIG.liveUrl, { cache: 'no-store', signal: ctrl.signal });
    if (!res.ok) throw new Error(res.status);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

async function refreshLive() {
  if (liveBusy) return;
  liveBusy = true;
  try {
    lastLive = await fetchLive();
    renderLive(lastLive, false);
  } catch {
    renderLive(lastLive, true);
  } finally {
    liveBusy = false;
  }
}

function showRankMessage(title, text) {
  $('rankHiddenTitle').textContent = title;
  $('rankHiddenText').textContent = text;
  els.rankHidden.hidden = false;
  els.rankLayout.hidden = true;
  els.rankMeta.textContent = '';
}

function renderLive(data, failed) {
  els.liveBadge.classList.toggle('off', failed || !data || data.hidden || data.notConnected);
  if (!data) {
    els.rankMeta.textContent = '순위를 불러오지 못했어요. 잠시 후 다시 시도합니다.';
    return;
  }
  if (data.notConnected) return showRankMessage('실시간 순위 준비 중이에요', '곧 순위가 표시됩니다.');
  if (data.hidden) {
    const joined = data.voters ? `지금까지 ${data.voters}명이 투표했어요. ` : '';
    return showRankMessage('지금은 순위가 비공개예요', `${joined}결과는 시상식에서 발표됩니다.`);
  }
  els.rankHidden.hidden = true;
  const time = new Date(data.updatedAt || Date.now()).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  els.rankMeta.textContent = failed
    ? `연결이 불안정해요 · ${time} 기준 결과`
    : `참여 ${data.voters || 0}명 · ${time} 기준 · ${CONFIG.liveRefreshSec}초마다 갱신`;
  renderRanks(data.counts || {});
}

function rankRows(counts) {
  const rows = BOOTHS.map((b) => ({ ...b, votes: Number(counts[b.name]) || 0 }));
  rows.sort((a, b) => b.votes - a.votes || a.no - b.no);
  for (const r of rows) {
    r.rank = 1 + rows.filter((o) => o.votes > r.votes).length;
    r.tied = rows.filter((o) => o.votes === r.votes).length > 1;
  }
  return rows;
}

const awardLabel = (r) => AWARDS[r.rank - 1] + (r.tied ? ' · 공동' : '');

// 표 수가 바뀌었으면 숫자를 살짝 튀게 함
function setVotes(node, name, votes) {
  const changed = prevVotes[name] !== undefined && prevVotes[name] !== votes;
  node.textContent = `${votes}표`;
  if (changed) {
    node.classList.remove('bump');
    void node.offsetWidth;
    node.classList.add('bump');
  }
}

function renderRanks(counts) {
  const rows = rankRows(counts);
  const max = Math.max(1, ...rows.map((r) => r.votes));
  const top = rows.slice(0, 3).filter((r) => r.votes > 0);
  els.rankLayout.hidden = false;
  renderPodium(top);
  renderList(rows.filter((r) => !top.includes(r)), max);
  prevVotes = Object.fromEntries(rows.map((r) => [r.name, r.votes]));
}

// 시상대: 화면 순서는 2등 · 1등 · 3등
function renderPodium(top) {
  els.podium.replaceChildren(...[1, 0, 2].map((i) => {
    const r = top[i];
    const tier = r ? r.rank : i + 1;
    const slot = el('div', `slot s${i + 1} t${tier}${r ? '' : ' empty'}`);
    const votes = el('span', 'slot-votes');
    if (r) setVotes(votes, r.name, r.votes);
    const block = el('div', 'block');
    block.append(el('span', 'block-rank', String(tier)), el('span', 'block-award', r ? awardLabel(r) : AWARDS[i]));
    slot.append(el('div', 'slot-emoji', r ? r.emoji : '?'), el('b', 'slot-name', r ? r.name : '—'), votes, block);
    return slot;
  }));
}

function createRankItem(r) {
  const li = el('li', 'rank');
  li.dataset.key = r.name;
  const name = el('div', 'name');
  name.append(el('b', null, r.name), el('span', 'award'));
  const meter = el('div', 'meter');
  meter.append(el('i'));
  const body = el('div', 'body');
  body.append(name, el('div', 'menu', r.menu ? `${r.no}번 · ${r.menu}` : `${r.no}번`), meter);
  li.append(el('span', 'pos'), el('span', 'emoji', r.emoji), body, el('span', 'votes'));
  return li;
}

function fillRankItem(li, r, max) {
  // 공동 3위처럼 시상대 밖에도 수상 대상이 있을 수 있음
  const tier = r.votes > 0 && r.rank <= 3 ? r.rank : 0;
  li.className = 'rank' + (tier ? ` winner t${tier}` : '');
  li.querySelector('.pos').textContent = r.votes > 0 ? r.rank : '–';
  setVotes(li.querySelector('.votes'), r.name, r.votes);
  const award = li.querySelector('.award');
  award.hidden = !tier;
  if (tier) award.textContent = awardLabel(r);
  li.querySelector('.meter i').style.width = `${(r.votes / max) * 100}%`;
}

function renderList(rows, max) {
  // 순위가 바뀐 항목이 제자리로 미끄러지듯 이동하도록 이전 위치를 기억
  const before = new Map();
  const existing = new Map();
  for (const li of els.ranks.children) {
    before.set(li.dataset.key, li.getBoundingClientRect());
    existing.set(li.dataset.key, li);
  }
  const keep = new Set(rows.map((r) => r.name));
  for (const [key, li] of existing) if (!keep.has(key)) li.remove();

  els.ranks.style.setProperty('--rows', Math.ceil(rows.length / 2));
  for (const r of rows) {
    const li = existing.get(r.name) || createRankItem(r);
    fillRankItem(li, r, max);
    els.ranks.append(li);
  }

  for (const li of els.ranks.children) {
    const prev = before.get(li.dataset.key);
    if (!prev || !li.animate) continue;
    const now = li.getBoundingClientRect();
    const dx = prev.left - now.left;
    const dy = prev.top - now.top;
    if (dx || dy) {
      li.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }], { duration: 600, easing: 'cubic-bezier(.2,.8,.2,1)' });
    }
  }
}

/* ───────────── 시작 ───────────── */

function init() {
  $('festival').textContent = CONFIG.festival;
  const [first, ...rest] = CONFIG.title.split(' ');
  $('title').replaceChildren(first, el('br'), el('em', null, rest.join(' ')));
  $('maxText').textContent = CONFIG.maxPicks;
  document.title = CONFIG.title;
  document.body.classList.toggle('board', BOARD);

  // 테스트용: 주소 끝에 ?reset 을 붙이면 이 기기의 투표 기록을 지움
  if (params.has('reset')) storage.clear();
  if (params.has('reset') || params.has('staff')) history.replaceState(null, '', location.pathname);

  if (formError) showBanner(formError, 'error');
  else if (!form) showBanner('테스트 모드 — 구글폼이 연결되지 않아 투표가 실제로 저장되지 않습니다.');
  else if (STAFF) showBanner('🛎️ 운영본부 모드 — 이 폰으로 여러 사람이 차례로 투표할 수 있어요.', 'staff');

  renderWho();
  applyType();
  fillSelect(els.gisu, CONFIG.classes);
  fillSelect(els.company, CONFIG.companies);
  renderBooths();
  updatePicks();

  for (const input of [els.gisu, els.company, els.name, els.phone]) {
    input.addEventListener('input', () => input.closest('.field').classList.remove('invalid'));
  }
  els.phone.addEventListener('input', () => { els.phone.value = els.phone.value.replace(/\D/g, '').slice(0, 4); });
  els.name.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); els.name.blur(); } });
  window.addEventListener('resize', syncBar);

  const win = votingWindow();
  const saved = storage.get();
  if (win === 'before') showClosed('아직 투표 전이에요', `${formatTime(new Date(CONFIG.voteStart))}부터 투표할 수 있어요.`);
  else if (win === 'after') showClosed('투표가 마감되었어요', '참여해 주셔서 감사합니다. 결과는 시상식에서 발표됩니다.');
  else if (saved && !STAFF) showDone(saved, false);
  else showVoteState('form');

  setTab(BOARD || params.has('rank') ? 'rank' : 'vote');
}

init();
</script>
</body>
</html>
